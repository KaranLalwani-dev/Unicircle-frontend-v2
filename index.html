<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Unicircle — Find Your Crew | MIT Bengaluru</title>
    <meta name="description" content="Unicircle is the student platform for MIT Bengaluru. Discover and join groups for hackathons, treks, cab shares, study sessions, and more." />
    <meta name="author" content="Unicircle" />
    <meta name="keywords" content="MIT Bengaluru, MAHE, student groups, hackathon teams, study groups, cab share, college community, Manipal" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://unicircle.in/" />

    <!-- Inline Critical CSS: paint header + hero before external CSS loads -->
    <style>
      /* Font fallback with size-adjust to prevent CLS when Inter loads */
      @font-face {
        font-family: 'Inter Fallback';
        src: local('Arial');
        size-adjust: 107%;
        ascent-override: 90%;
        descent-override: 22%;
        line-gap-override: 0%;
      }
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-text-size-adjust:100%}
      body{font-family:'Inter','Inter Fallback',system-ui,-apple-system,sans-serif;
           background:#eff6ff;color:#171717;-webkit-font-smoothing:antialiased}
      /* Static shell styles */
      .shell-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;
                     justify-content:space-between;padding:.75rem 1.5rem;
                     background:hsla(0,0%,100%,.8);backdrop-filter:blur(12px);
                     border-bottom:1px solid hsl(0,0%,89.8%)}
      .shell-logo{font-size:1.125rem;font-weight:600;letter-spacing:-.025em;color:#171717}
      .shell-actions{display:flex;gap:.5rem}
      .shell-btn{display:inline-flex;align-items:center;padding:.5rem 1rem;
                  border-radius:.5rem;font-size:.875rem;font-weight:500;
                  text-decoration:none;border:none;cursor:pointer}
      .shell-btn-ghost{background:transparent;color:#171717}
      .shell-btn-primary{background:#171717;color:#fafafa}
      .shell-hero{display:flex;flex-direction:column;align-items:center;
                   justify-content:center;text-align:center;padding:4rem 1.5rem 2rem;
                   min-height:50vh}
      .shell-hero h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:800;
                      line-height:1.1;letter-spacing:-.025em;color:#171717;
                      max-width:48rem;margin-bottom:1rem}
      .shell-hero p{font-size:1.125rem;color:#737373;max-width:36rem}
      .shell-spinner{display:flex;align-items:center;justify-content:center;
                      padding:2rem}
      .shell-spinner div{width:2rem;height:2rem;border:3px solid #e5e5e5;
                          border-top-color:#171717;border-radius:50%;
                          animation:spin .6s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>

    <!-- Google Fonts Preconnect & Async Stylesheet (Non-render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Unicircle" />
    <meta property="og:title" content="Unicircle — Find Your Crew | MIT Bengaluru" />
    <meta property="og:description" content="Discover and join groups for hackathons, treks, cab shares, study sessions, and more. Built by MIT Bengaluru students." />
    <meta property="og:url" content="https://unicircle.in/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Unicircle — Find Your Crew | MIT Bengaluru" />
    <meta name="twitter:description" content="Discover and join groups for hackathons, treks, cab shares, study sessions, and more. Built by MIT Bengaluru students." />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Unicircle",
      "url": "https://unicircle.in",
      "description": "Student group discovery platform for MIT Bengaluru",
      "applicationCategory": "SocialNetworkingApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      }
    }
    </script>

    <!-- Google tag (gtag.js) - Deferred loading to avoid main-thread blocking -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-33N87RFJN3');

      function loadGTM() {
        if (window.__gtmLoaded) return;
        window.__gtmLoaded = true;
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-33N87RFJN3';
        document.head.appendChild(script);
      }

      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadGTM, { timeout: 4000 });
      } else {
        window.addEventListener('load', loadGTM, { once: true });
      }
    </script>
  </head>

  <body>
    <!-- Static HTML shell: gives browser immediate content to paint before React boots -->
    <!-- React will overwrite this on mount, eliminating LCP render delay -->
    <div id="root">
      <header class="shell-header">
        <span class="shell-logo">Unicircle</span>
        <div class="shell-actions">
          <a class="shell-btn shell-btn-ghost" href="/login">Log in</a>
          <a class="shell-btn shell-btn-primary" href="/login">Sign up</a>
        </div>
      </header>
      <section class="shell-hero">
        <h1>Find Your Crew at MIT Bengaluru</h1>
        <p>Join groups for hackathons, treks, cab shares, study sessions, and more.</p>
        <div class="shell-spinner"><div></div></div>
      </section>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
